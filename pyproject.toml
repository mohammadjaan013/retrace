[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "retrace"
version = "0.1.0.dev0"
description = "Find out which stage of your RAG pipeline is actually broken."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["rag", "retrieval", "evaluation", "llm", "diagnostics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# The core has NO required dependencies. This is deliberate and load-bearing:
# `pip install retrace` must never drag in torch, a vector DB client, or an
# LLM SDK. Anything heavy lives behind an extra.
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=5.0"]
anthropic = ["anthropic>=1.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
retrace = "retrace.cli:main"

[project.urls]
Homepage = "https://github.com/mohammadjaan013/retrace"

[tool.hatch.build.targets.wheel]
packages = ["src/retrace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
